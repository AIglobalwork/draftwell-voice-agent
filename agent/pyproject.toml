[project]
name = "draftwell"
version = "0.1.0"
description = "Voice booking agent for Draftwell, a fictional duct-cleaning company"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[google]~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
    "google-api-python-client",
    "google-auth",
    "httpx",
    "pyyaml",
    "twilio",
    "python-dotenv",
    "tzdata",  # time zone data for Windows
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftwell"]

[tool.uv]
# yarl 1.24.1 has no wheel for Python 3.11+ (same pin as the spike)
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: conversation tests that call a real text model (need GOOGLE_API_KEY)"]
